[project]
name = "sidecar"
version = "0.1.0"
description = "Local Tauri Sidecar that proxies to the remote Statikor Cloud and drives local software."
readme = "README.md"
authors = [
    { name = "charliemisner", email = "charliemisner@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
]

[project.scripts]
start-sidecar = "sidecar.sidecar:start"
sidecar = "sidecar.sidecar:start"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
]

